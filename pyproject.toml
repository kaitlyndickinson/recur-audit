[project]
name = "household-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "ofxparse==0.21",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # ofxparse still calls BeautifulSoup's old findAll
    "ignore::DeprecationWarning:ofxparse",
]
