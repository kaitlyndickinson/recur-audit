{% extends "base.html" %}
{% block title %}Import · Household{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Import an export</h1>
  <p class="muted">CSV, OFX or QFX from your bank or card. Overlapping date ranges are fine because duplicates are skipped. The original file is kept untouched on this machine.</p>

  <form class="card form" hx-post="/import" hx-encoding="multipart/form-data" hx-target="#import-result"
        hx-on::after-request="if (event.detail.successful) this.querySelector('[type=file]').value = ''">
    <label class="field">
      <span>File</span>
      <input type="file" name="file" accept=".csv,.ofx,.qfx" required>
    </label>
    <label class="field">
      <span>Account</span>
      <input type="text" name="account" list="accounts" placeholder="Checking, Travel card…" autocomplete="off" required>
      <datalist id="accounts">
        {% for account in accounts %}<option value="{{ account }}">{% endfor %}
      </datalist>
      <small class="muted">Use the same name each time you import from this account.</small>
    </label>
    <button class="button primary" type="submit">
      <span class="idle">Import</span><span class="busy">Importing…</span>
    </button>
  </form>
  <div id="import-result" aria-live="polite"></div>
</section>
{% endblock %}
