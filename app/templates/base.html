<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d0e16">
  <link rel="preload" href="/static/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
  <title>{% block title %}Household{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">~/household<span>›</span></a>
    <nav class="tabs" aria-label="Sections">
      {% set here = request.url.path %}
      <a href="/" {% if here in ("/", "/merchant") %}aria-current="page"{% endif %}>Subscriptions</a>
      <a href="/merchants" {% if here == "/merchants" %}aria-current="page"{% endif %}>Merchants</a>
      <a href="/import" {% if here == "/import" %}aria-current="page"{% endif %}>Import</a>
    </nav>
    <span class="who" title="{{ user }}">{{ user[0] | upper }}</span>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
